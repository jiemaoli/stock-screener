server {
    listen 80;
    server_name stock-min.hhxs.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name stock-min.hhxs.top;

    ssl_certificate /etc/nginx/certs/hhxs.crt;
    ssl_certificate_key /etc/nginx/certs/hhxs.key;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://stock-screener-dashboard:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_read_timeout 2500s;
        proxy_send_timeout 2500s;
        proxy_connect_timeout 60s;
    }
}
